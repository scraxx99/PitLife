<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pit Status</title>
<style>
  :root {
    --green: #16a34a;
    --yellow: #facc15;
    --red: #dc2626;
    --bg: #0f1115;
    --panel: #1a1d24;
    --line: #2b303b;
    --text: #f3f4f6;
    --muted: #9aa3b2;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    transition: background .4s ease, color .4s ease;
  }

  /* Whole page takes the status color on the Status tab */
  body.on-display.s-green  { background: var(--green);  color: #fff; }
  body.on-display.s-yellow { background: var(--yellow); color: #1c1500; }
  body.on-display.s-red    { background: var(--red);    color: #fff; }
  body.on-display.s-none   { background: #374151;       color: #fff; }

  /* Tabs */
  .tabs {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; gap: 8px; padding: 10px 12px; padding-top: max(10px, env(safe-area-inset-top));
    align-items: center;
  }
  .tab {
    appearance: none; border: 2px solid currentColor; background: transparent; color: inherit;
    font: inherit; font-weight: 700; font-size: 1rem; letter-spacing: .03em;
    padding: 10px 18px; border-radius: 999px; cursor: pointer; opacity: .55;
  }
  .tab[aria-selected="true"] { opacity: 1; background: rgba(255,255,255,.18); }
  body.on-display.s-yellow .tab[aria-selected="true"] { background: rgba(0,0,0,.12); }
  .conn { margin-left: auto; font-size: .85rem; opacity: .8; }
  .conn.bad { font-weight: 700; opacity: 1; }

  .view { display: none; }
  .view.active { display: block; }

  /* Status tab */
  #display.active {
    min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 80px 24px 24px;
  }
  .big { font-size: clamp(3rem, 17vw, 14rem); font-weight: 900; line-height: .95; letter-spacing: -.02em; }
  .small { font-size: clamp(1.1rem, 3.5vw, 2.4rem); margin-top: 1.2rem; font-weight: 600; opacity: .95; }
  .stamp { margin-top: 2rem; font-size: 1rem; opacity: .75; }
  body.on-display.s-red .big { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .55; } }
  @media (prefers-reduced-motion: reduce) { body.on-display.s-red .big { animation: none; } }

  /* Pit tab */
  #pit { max-width: 640px; margin: 0 auto; padding: 76px 16px 40px; }
  h2 { font-size: .85rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin: 28px 0 10px; }
  h2:first-child { margin-top: 0; }

  .status-btns { display: grid; gap: 12px; }
  .sbtn {
    appearance: none; border: 4px solid transparent; border-radius: 18px; cursor: pointer;
    font: inherit; text-align: left; padding: 22px 20px; min-height: 92px;
    display: flex; flex-direction: column; justify-content: center; gap: 2px;
  }
  .sbtn b { font-size: 1.7rem; letter-spacing: .02em; }
  .sbtn span { font-size: 1rem; opacity: .9; }
  .sbtn.green  { background: var(--green);  color: #fff; }
  .sbtn.yellow { background: var(--yellow); color: #1c1500; }
  .sbtn.red    { background: var(--red);    color: #fff; }
  .sbtn[aria-pressed="true"] { border-color: #fff; box-shadow: 0 0 0 3px rgba(255,255,255,.25); }
  .sbtn[aria-pressed="true"] b::after { content: "  ✓ CURRENT"; font-size: .85rem; font-weight: 700; }
  .sbtn:active { transform: scale(.985); }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 14px; }
  input[type="text"], input[type="search"], input[type="password"] {
    width: 100%; font: inherit; font-size: 1.1rem; color: var(--text);
    background: #0f1115; border: 2px solid var(--line); border-radius: 12px; padding: 14px;
  }
  input:focus { outline: none; border-color: #60a5fa; }

  .people { margin: 10px 0; max-height: 38vh; overflow-y: auto; display: grid; gap: 6px; }
  .person {
    appearance: none; border: 2px solid transparent; background: #232731; color: var(--text);
    font: inherit; font-size: 1.15rem; text-align: left; padding: 14px; border-radius: 12px; cursor: pointer;
    display: flex; justify-content: space-between; gap: 8px;
  }
  .person small { color: var(--muted); font-size: .9rem; align-self: center; }
  .person[aria-pressed="true"] { border-color: #60a5fa; background: #1e3a5f; }
  .empty { color: var(--muted); padding: 14px; text-align: center; }

  .send {
    appearance: none; width: 100%; border: 0; border-radius: 14px; cursor: pointer;
    font: inherit; font-size: 1.3rem; font-weight: 800; padding: 20px; margin-top: 12px;
    background: #2563eb; color: #fff;
  }
  .send:disabled { background: #2b303b; color: #6b7280; cursor: not-allowed; }
  .send:active:not(:disabled) { transform: scale(.985); }

  .row { display: flex; gap: 8px; }
  .row button { appearance: none; border: 0; border-radius: 12px; padding: 0 20px; font: inherit; font-weight: 700; background: #2563eb; color: #fff; cursor: pointer; }
  .hidden { display: none !important; }
  .warn { color: #fbbf24; font-size: .9rem; margin-top: 8px; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 140%);
    background: #111827; color: #fff; border: 1px solid #374151; padding: 14px 20px; border-radius: 14px;
    font-weight: 700; transition: transform .25s ease; z-index: 20; max-width: 90vw; text-align: center;
  }
  .toast.show { transform: translate(-50%, 0); }
  .toast.err { background: #7f1d1d; border-color: #dc2626; }
</style>
</head>
<body class="on-display s-none">

<nav class="tabs" role="tablist">
  <button class="tab" role="tab" id="tab-display" data-tab="display" aria-selected="true">STATUS</button>
  <button class="tab" role="tab" id="tab-pit" data-tab="pit" aria-selected="false">PIT CONTROL</button>
  <span class="conn" id="conn"></span>
</nav>

<!-- TAB 1: full-page color status -->
<main id="display" class="view active" aria-live="polite">
  <div class="big" id="bigLabel">NO STATUS</div>
  <div class="small" id="smallLabel">Open Pit Control to set one</div>
  <div class="stamp" id="stamp"></div>
</main>

<!-- TAB 2: pit person's form -->
<main id="pit" class="view">
  <div id="pinBox" class="card hidden" style="margin-bottom:20px">
    <h2>Enter pit PIN</h2>
    <div class="row">
      <input type="password" id="pinInput" inputmode="numeric" autocomplete="off" placeholder="PIN">
      <button id="pinSave">Save</button>
    </div>
  </div>

  <h2>Robot status</h2>
  <div class="status-btns">
    <button class="sbtn green"  data-status="green"  aria-pressed="false"><b>READY</b><span>Robot is ready for match</span></button>
    <button class="sbtn yellow" data-status="yellow" aria-pressed="false"><b>PREPPING</b><span>Robot is being prepped</span></button>
    <button class="sbtn red"    data-status="red"    aria-pressed="false"><b>BUSY</b><span>We're in Crunch Mode please Comeback Later</span></button>
  </div>

  <h2>Need someone in the pit?</h2>
  <div class="card">
    <input type="search" id="search" placeholder="Search name…" autocomplete="off" autocapitalize="off">
    <div class="people" id="people"></div>
    <div class="warn hidden" id="peopleWarn"></div>
    <input type="text" id="note" maxlength="200" placeholder="Optional note (e.g. bring a battery)">
    <button class="send" id="send" disabled>Pick a person</button>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const LABELS = {
    green:  { big: "READY",    small: "Robot is ready for match" },
    yellow: { big: "PREPPING", small: "Robot is being prepped" },
    red:    { big: "BUSY",  small: "We're in Crunch Mode please Comeback Later" },
  };

  const store = {
    get(k) { try { return localStorage.getItem(k) || ""; } catch { return ""; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
    del(k) { try { localStorage.removeItem(k); } catch {} },
  };

  let state = { status: null, updatedAt: null, pinRequired: false };
  let people = [];
  let selected = null;
  let pin = store.get("pitPin");

  /* ---------- tabs ---------- */
  function showTab(name) {
    document.querySelectorAll(".tab").forEach((t) =>
      t.setAttribute("aria-selected", String(t.dataset.tab === name)));
    $("#display").classList.toggle("active", name === "display");
    $("#pit").classList.toggle("active", name === "pit");
    document.body.classList.toggle("on-display", name === "display");
    store.set("pitTab", name);
    history.replaceState(null, "", "#" + name);
    render();
  }
  document.querySelectorAll(".tab").forEach((t) =>
    t.addEventListener("click", () => showTab(t.dataset.tab)));

  /* ---------- render ---------- */
  function render() {
    const s = state.status;
    ["s-green", "s-yellow", "s-red", "s-none"].forEach((c) => document.body.classList.remove(c));
    document.body.classList.add(s ? "s-" + s : "s-none");

    if (s && LABELS[s]) {
      $("#bigLabel").textContent = LABELS[s].big;
      $("#smallLabel").textContent = LABELS[s].small;
    } else {
      $("#bigLabel").textContent = "NO STATUS";
      $("#smallLabel").textContent = "Open Pit Control to set one";
    }
    $("#stamp").textContent = state.updatedAt
      ? "Updated " + new Date(state.updatedAt).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })
      : "";

    document.querySelectorAll(".sbtn").forEach((b) =>
      b.setAttribute("aria-pressed", String(b.dataset.status === s)));

    $("#pinBox").classList.toggle("hidden", !(state.pinRequired && !pin));
  }

  /* ---------- status polling ---------- */
  function setConn(ok) {
    const el = $("#conn");
    el.textContent = ok ? "" : "Offline, retrying…";
    el.classList.toggle("bad", !ok);
  }
  async function refresh() {
    try {
      const r = await fetch("/api/status", { cache: "no-store" });
      if (!r.ok) throw new Error();
      state = await r.json();
      setConn(true);
      render();
    } catch {
      setConn(false);
    }
  }

  /* ---------- helpers ---------- */
  let toastTimer;
  function toast(msg, isErr) {
    const t = $("#toast");
    t.textContent = msg;
    t.classList.toggle("err", !!isErr);
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), isErr ? 4500 : 2200);
  }
  async function post(url, body) {
    const r = await fetch(url, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ ...body, pin }),
    });
    const data = await r.json().catch(() => ({}));
    if (r.status === 401) { pin = ""; store.del("pitPin"); render(); }
    if (!r.ok) throw new Error(data.error || "Something went wrong");
    return data;
  }

  /* ---------- PIN ---------- */
  $("#pinSave").addEventListener("click", () => {
    pin = $("#pinInput").value.trim();
    if (pin) { store.set("pitPin", pin); $("#pinInput").value = ""; }
    render();
  });

  /* ---------- set status ---------- */
  document.querySelectorAll(".sbtn").forEach((b) =>
    b.addEventListener("click", async () => {
      if (state.pinRequired && !pin) return toast("Enter the pit PIN first", true);
      const prev = state.status;
      state.status = b.dataset.status;
      render();
      try {
        const d = await post("/api/status", { status: b.dataset.status });
        state = d;
        render();
        navigator.vibrate?.(40);
      } catch (e) {
        state.status = prev;
        render();
        toast(e.message, true);
      }
    }));

  /* ---------- people ---------- */
  function renderPeople() {
    const q = $("#search").value.trim().toLowerCase();
    const list = $("#people");
    list.textContent = "";
    const matches = people.filter((p) =>
      !q || p.name.toLowerCase().includes(q) || (p.handle || "").toLowerCase().includes(q));

    if (!matches.length) {
      const e = document.createElement("div");
      e.className = "empty";
      e.textContent = people.length ? "No matches" : "No people loaded";
      list.appendChild(e);
    }
    for (const p of matches) {
      const b = document.createElement("button");
      b.className = "person";
      b.setAttribute("aria-pressed", String(selected?.id === p.id));
      const n = document.createElement("span");
      n.textContent = p.name;
      b.appendChild(n);
      if (p.handle && p.handle.toLowerCase() !== p.name.toLowerCase()) {
        const h = document.createElement("small");
        h.textContent = "@" + p.handle;
        b.appendChild(h);
      }
      b.addEventListener("click", () => {
        selected = selected?.id === p.id ? null : p;
        renderPeople();
        updateSend();
      });
      list.appendChild(b);
    }
  }
  function updateSend() {
    const btn = $("#send");
    btn.disabled = !selected;
    btn.textContent = selected ? "Call " + selected.name + " to the pit" : "Pick a person";
  }
  $("#search").addEventListener("input", renderPeople);

  async function loadPeople() {
    try {
      const r = await fetch("/api/people", { cache: "no-store" });
      const d = await r.json();
      people = d.people || [];
      const w = $("#peopleWarn");
      w.textContent = d.warning || "";
      w.classList.toggle("hidden", !d.warning);
    } catch {
      people = [];
      $("#peopleWarn").textContent = "Couldn't load the people list.";
      $("#peopleWarn").classList.remove("hidden");
    }
    renderPeople();
  }

  $("#send").addEventListener("click", async () => {
    if (!selected) return;
    if (state.pinRequired && !pin) return toast("Enter the pit PIN first", true);
    const btn = $("#send");
    const who = selected;
    btn.disabled = true;
    btn.textContent = "Sending…";
    try {
      await post("/api/notify", { userId: who.id, note: $("#note").value });
      toast("Sent to " + who.name + " ✓");
      navigator.vibrate?.(60);
      selected = null;
      $("#note").value = "";
      $("#search").value = "";
      renderPeople();
    } catch (e) {
      toast(e.message, true);
    }
    updateSend();
  });

  /* ---------- start ---------- */
  const startTab = ["display", "pit"].includes(location.hash.slice(1))
    ? location.hash.slice(1)
    : store.get("pitTab") || "display";
  showTab(startTab);
  refresh();
  setInterval(refresh, 3000);
  loadPeople();
})();
</script>
</body>
</html>
